name: fluxa_pos
description: Fluxa POS client for Android, desktop and web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_info_plus: 11.5.0
  dio: 5.10.0
  drift: ^2.28.2
  drift_flutter: ^0.2.5
  flutter_riverpod: 3.3.2
  flutter_secure_storage: 10.3.1
  go_router: 16.3.0
  package_info_plus: 8.3.1
  printing: 5.14.3

dev_dependencies:
  build_runner: ^2.6.0
  crypto: 3.0.7
  drift_dev: ^2.28.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
