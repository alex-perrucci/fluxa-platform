name: fluxa

x-backend-common: &backend-common
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - data
    - app
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    env_file:
      - .env
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  migrate:
    image: fluxa-tools:${RELEASE_SHA}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: build
    env_file:
      - .env
    command:
      - npm
      - run
      - db:migrate
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  bootstrap-admin:
    image: fluxa-tools:${RELEASE_SHA}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: build
    env_file:
      - .env
    command:
      - npm
      - run
      - db:seed
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  api:
    <<: *backend-common
    image: fluxa-backend:${RELEASE_SHA}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
      args:
        FLUXA_APP: api
    environment:
      FLUXA_APP: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/v1/health/ready')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  background-worker:
    <<: *backend-common
    image: fluxa-backend:${RELEASE_SHA}
    environment:
      FLUXA_APP: background-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - kill -0 1
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  fiscal-worker:
    <<: *backend-common
    image: fluxa-backend:${RELEASE_SHA}
    environment:
      FLUXA_APP: fiscal-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - kill -0 1
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    profiles:
      - fiscal

  ade-fiscal-worker:
    image: fluxa-backend:${RELEASE_SHA}
    restart: unless-stopped
    environment:
      FLUXA_APP: ade-fiscal-worker
      ADE_WORKER_PORT: '3010'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - '3010'
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3010/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    profiles:
      - ade-fiscal

  web:
    image: fluxa-web:${RELEASE_SHA}
    build:
      context: ../..
      dockerfile: Dockerfile.web
      args:
        FLUXA_API_BASE_URL: https://${API_DOMAIN}/api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      FLUXA_API_BASE_URL: https://${API_DOMAIN}/api/v1
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
      - edge
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - caddy validate --config /etc/caddy/Caddyfile
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

networks:
  data:
    internal: true
  app:
  edge:

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
