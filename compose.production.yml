services:
  api:
    build:
      context: .
      args:
        FLUXA_APP: api
    env_file: .env.production
    restart: unless-stopped
    init: true
    ports:
      - '${API_PORT:-3000}:3000'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch(`http://127.0.0.1:${process.env.API_PORT||3000}/api/v1/health/ready`).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s

  fiscal-worker:
    build:
      context: .
      args:
        FLUXA_APP: fiscal-worker
    env_file: .env.production
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s

  background-worker:
    build:
      context: .
      args:
        FLUXA_APP: background-worker
    env_file: .env.production
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s
