name: Apply responsive cashier content patch

on:
  push:
    branches:
      - fix/pos-responsive-content-layout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pos-responsive-content-layout
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true
      - name: Apply layout fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))

          operator = 'apps/pos/lib/features/catalog/presentation/operator_cashier_screen.dart'
          replace_once(
              operator,
              "import 'catalog_controller.dart';\n",
              "import 'cashier_responsive_layout.dart';\nimport 'catalog_controller.dart';\n",
          )
          replace_once(
              operator,
              """        Expanded(
          child: LayoutBuilder(
            builder: (context, constraints) {
              final catalogPane = _CatalogPane(
                location: location,
                snapshot: snapshot,
                catalog: catalog,
                orders: orders,
              );
              final orderPane = _OrderPane(
                orders: orders,
                currency: snapshot.currency,
              );
              if (constraints.maxWidth >= 980) {
                return Row(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Expanded(child: catalogPane),
                    const SizedBox(width: 14),
                    SizedBox(width: 410, child: orderPane),
                  ],
                );
              }
              return Column(
                children: [
                  SizedBox(height: 250, child: orderPane),
                  const SizedBox(height: 10),
                  Expanded(child: catalogPane),
                ],
              );
            },
          ),
        ),""",
              """        Expanded(
          child: CashierResponsiveWorkspace(
            hasActiveContent: orders.activeOrder?.items.isNotEmpty == true,
            catalogPane: _CatalogPane(
              location: location,
              snapshot: snapshot,
              catalog: catalog,
              orders: orders,
            ),
            orderPane: _OrderPane(
              orders: orders,
              currency: snapshot.currency,
            ),
          ),
        ),""",
          )
          replace_once(
              operator,
              """        Expanded(
          child: Stack(
            children: [
              Positioned.fill(
                child: products.isEmpty
                    ? const FluxaEmptyView(
                        icon: Icons.search_off,
                        title: 'Nessun prodotto',
                        message: 'Cambia ricerca oppure usa Importo libero.',
                      )
                    : LayoutBuilder(
                        builder: (context, constraints) {
                          final columns = switch (constraints.maxWidth) {
                            >= 1180 => 5,
                            >= 860 => 4,
                            >= 580 => 3,
                            >= 380 => 2,
                            _ => 1,
                          };
                          return GridView.builder(
                            padding: const EdgeInsets.only(bottom: 88),
                            gridDelegate:
                                SliverGridDelegateWithFixedCrossAxisCount(
                                  crossAxisCount: columns,
                                  crossAxisSpacing: 10,
                                  mainAxisSpacing: 10,
                                  childAspectRatio: columns == 1 ? 3 : 1.35,
                                ),
                            itemCount: products.length,
                            itemBuilder: (context, index) => _ProductButton(
                              product: products[index],
                              currency: snapshot.currency,
                              orders: orders,
                            ),
                          );
                        },
                      ),
              ),
              Positioned(
                right: 4,
                bottom: 4,
                child: FloatingActionButton.extended(
                  key: const Key('operator-manual-amount'),
                  heroTag: 'operator-manual-amount',
                  onPressed: orders.busy
                      ? null
                      : () => showManualAmountKeypad(
                          context,
                          controller: orders,
                          currency: snapshot.currency,
                        ),
                  icon: const Icon(Icons.dialpad),
                  label: const Text('Importo libero'),
                ),
              ),
            ],
          ),
        ),""",
              """        Expanded(
          child: products.isEmpty
              ? const FluxaEmptyView(
                  icon: Icons.search_off,
                  title: 'Nessun prodotto',
                  message: 'Cambia ricerca oppure usa Importo libero.',
                )
              : LayoutBuilder(
                  builder: (context, constraints) {
                    final columns = switch (constraints.maxWidth) {
                      >= 1180 => 5,
                      >= 860 => 4,
                      >= 580 => 3,
                      >= 380 => 2,
                      _ => 1,
                    };
                    return GridView.builder(
                      gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(
                        crossAxisCount: columns,
                        crossAxisSpacing: 10,
                        mainAxisSpacing: 10,
                        childAspectRatio: columns == 1 ? 3 : 1.35,
                      ),
                      itemCount: products.length,
                      itemBuilder: (context, index) => _ProductButton(
                        product: products[index],
                        currency: snapshot.currency,
                        orders: orders,
                      ),
                    );
                  },
                ),
        ),
        const SizedBox(height: 8),
        Align(
          alignment: Alignment.centerRight,
          child: FilledButton.tonalIcon(
            key: const Key('operator-manual-amount'),
            onPressed: orders.busy
                ? null
                : () => showManualAmountKeypad(
                    context,
                    controller: orders,
                    currency: snapshot.currency,
                  ),
            icon: const Icon(Icons.dialpad),
            label: const Text('Importo libero'),
          ),
        ),""",
          )

          offline = 'apps/pos/lib/features/catalog/presentation/offline_cashier_screen.dart'
          replace_once(
              offline,
              "import 'catalog_controller.dart';\n",
              "import 'cashier_responsive_layout.dart';\nimport 'catalog_controller.dart';\n",
          )
          replace_once(
              offline,
              """          Expanded(
            child: LayoutBuilder(
              builder: (context, constraints) {
                final catalogPane = _OfflineCatalogPane(
                  snapshot: snapshot,
                  catalog: catalog,
                  sale: sale,
                );
                final cart = _OfflineCartPane(
                  sale: sale,
                  currency: snapshot.currency,
                  onCash: () => _completeCashSale(sale, snapshot.currency),
                );
                if (constraints.maxWidth >= 980) {
                  return Row(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      Expanded(child: catalogPane),
                      const SizedBox(width: 14),
                      SizedBox(width: 410, child: cart),
                    ],
                  );
                }
                return Column(
                  children: [
                    SizedBox(height: 280, child: cart),
                    const SizedBox(height: 10),
                    Expanded(child: catalogPane),
                  ],
                );
              },
            ),
          ),""",
              """          Expanded(
            child: CashierResponsiveWorkspace(
              hasActiveContent: sale.items.isNotEmpty,
              catalogPane: _OfflineCatalogPane(
                snapshot: snapshot,
                catalog: catalog,
                sale: sale,
              ),
              orderPane: _OfflineCartPane(
                sale: sale,
                currency: snapshot.currency,
                onCash: () => _completeCashSale(sale, snapshot.currency),
              ),
            ),
          ),""",
          )
          replace_once(
              offline,
              """  @override
  Widget build(BuildContext context) => Material(
    color: Theme.of(context).colorScheme.tertiaryContainer,
    borderRadius: BorderRadius.circular(14),
    child: Padding(
      padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 10),
      child: Row(
        children: [
          const Icon(Icons.cloud_off_outlined),
          const SizedBox(width: 12),
          const Expanded(
            child: Column(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                Text(
                  'MODALITÀ OFFLINE',
                  style: TextStyle(fontWeight: FontWeight.w800),
                ),
                Text(
                  'Catalogo locale attivo · vendite consentite solo in contanti',
                ),
              ],
            ),
          ),
          if (pendingCount > 0)
            Padding(
              padding: const EdgeInsets.only(right: 10),
              child: Chip(label: Text('$pendingCount da sincronizzare')),
            ),
          FilledButton.tonalIcon(
            onPressed: syncing ? null : onReconnect,
            icon: syncing
                ? const SizedBox.square(
                    dimension: 18,
                    child: CircularProgressIndicator(strokeWidth: 2),
                  )
                : const Icon(Icons.sync),
            label: const Text('Riprova rete'),
          ),
        ],
      ),
    ),
  );""",
              """  @override
  Widget build(BuildContext context) => Material(
    color: Theme.of(context).colorScheme.tertiaryContainer,
    borderRadius: BorderRadius.circular(14),
    child: Padding(
      padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 10),
      child: LayoutBuilder(
        builder: (context, constraints) {
          final status = Row(
            children: [
              const Icon(Icons.cloud_off_outlined),
              const SizedBox(width: 12),
              const Expanded(
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Text(
                      'MODALITÀ OFFLINE',
                      style: TextStyle(fontWeight: FontWeight.w800),
                    ),
                    Text(
                      'Catalogo locale attivo · vendite consentite solo in contanti',
                    ),
                  ],
                ),
              ),
            ],
          );
          final retry = FilledButton.tonalIcon(
            onPressed: syncing ? null : onReconnect,
            icon: syncing
                ? const SizedBox.square(
                    dimension: 18,
                    child: CircularProgressIndicator(strokeWidth: 2),
                  )
                : const Icon(Icons.sync),
            label: const Text('Riprova rete'),
          );
          if (constraints.maxWidth < 680) {
            return Column(
              crossAxisAlignment: CrossAxisAlignment.stretch,
              children: [
                status,
                if (pendingCount > 0) ...[
                  const SizedBox(height: 8),
                  Align(
                    alignment: Alignment.centerLeft,
                    child: Chip(label: Text('$pendingCount da sincronizzare')),
                  ),
                ],
                const SizedBox(height: 8),
                retry,
              ],
            );
          }
          return Row(
            children: [
              Expanded(child: status),
              if (pendingCount > 0) ...[
                const SizedBox(width: 10),
                Chip(label: Text('$pendingCount da sincronizzare')),
              ],
              const SizedBox(width: 10),
              retry,
            ],
          );
        },
      ),
    ),
  );""",
          )

          fast = 'apps/pos/lib/features/catalog/presentation/fast_cashier_screen.dart'
          replace_once(
              fast,
              "import 'catalog_controller.dart';\n",
              "import 'cashier_responsive_layout.dart';\nimport 'catalog_controller.dart';\n",
          )
          replace_once(
              fast,
              """  @override
  Widget build(BuildContext context) => Padding(
    padding: const EdgeInsets.all(16),
    child: LayoutBuilder(
      builder: (context, constraints) {
        final catalog = _FastCatalog(
          catalogController: catalogController,
          orderController: orderController,
          location: location,
          snapshot: snapshot,
        );
        final order = _FastOrderPanel(
          controller: orderController,
          currency: snapshot.currency,
        );

        if (constraints.maxWidth >= 1050) {
          return Row(
            crossAxisAlignment: CrossAxisAlignment.stretch,
            children: [
              Expanded(child: catalog),
              const SizedBox(width: 16),
              SizedBox(width: 410, child: order),
            ],
          );
        }

        return Column(
          children: [
            SizedBox(height: 220, child: order),
            const SizedBox(height: 12),
            Expanded(child: catalog),
          ],
        );
      },
    ),
  );""",
              """  @override
  Widget build(BuildContext context) => Padding(
    padding: const EdgeInsets.all(16),
    child: CashierResponsiveWorkspace(
      hasActiveContent:
          orderController.activeOrder?.items.isNotEmpty == true ||
          orderController.draft != null,
      sideBySideMinWidth: 1050,
      catalogPane: _FastCatalog(
        catalogController: catalogController,
        orderController: orderController,
        location: location,
        snapshot: snapshot,
      ),
      orderPane: _FastOrderPanel(
        controller: orderController,
        currency: snapshot.currency,
      ),
    ),
  );""",
          )
          replace_once(
              fast,
              """        Expanded(
          child: Stack(
            children: [
              Positioned.fill(
                child: products.isEmpty
                    ? const FluxaEmptyView(
                        icon: Icons.search_off,
                        title: 'Nessun prodotto',
                        message: 'Prova un’altra ricerca o usa Importo libero.',
                      )
                    : LayoutBuilder(
                        builder: (context, constraints) {
                          final columns = switch (constraints.maxWidth) {
                            >= 1200 => 5,
                            >= 900 => 4,
                            >= 620 => 3,
                            >= 400 => 2,
                            _ => 1,
                          };
                          return GridView.builder(
                            key: const Key('fast-cashier-product-grid'),
                            padding: const EdgeInsets.only(bottom: 88),
                            gridDelegate:
                                SliverGridDelegateWithFixedCrossAxisCount(
                                  crossAxisCount: columns,
                                  crossAxisSpacing: 10,
                                  mainAxisSpacing: 10,
                                  childAspectRatio: columns == 1 ? 2.8 : 1.35,
                                ),
                            itemCount: products.length,
                            itemBuilder: (context, index) => _FastProductTile(
                              product: products[index],
                              currency: snapshot.currency,
                              controller: orderController,
                            ),
                          );
                        },
                      ),
              ),
              Positioned(
                right: 4,
                bottom: 4,
                child: FloatingActionButton.extended(
                  key: const Key('fast-cashier-manual-amount'),
                  heroTag: 'fast-cashier-manual-amount',
                  onPressed: orderController.busy
                      ? null
                      : () => showManualAmountKeypad(
                          context,
                          controller: orderController,
                          currency: snapshot.currency,
                        ),
                  icon: const Icon(Icons.dialpad),
                  label: const Text('Importo libero'),
                ),
              ),
            ],
          ),
        ),""",
              """        Expanded(
          child: products.isEmpty
              ? const FluxaEmptyView(
                  icon: Icons.search_off,
                  title: 'Nessun prodotto',
                  message: 'Prova un’altra ricerca o usa Importo libero.',
                )
              : LayoutBuilder(
                  builder: (context, constraints) {
                    final columns = switch (constraints.maxWidth) {
                      >= 1200 => 5,
                      >= 900 => 4,
                      >= 620 => 3,
                      >= 400 => 2,
                      _ => 1,
                    };
                    return GridView.builder(
                      key: const Key('fast-cashier-product-grid'),
                      gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(
                        crossAxisCount: columns,
                        crossAxisSpacing: 10,
                        mainAxisSpacing: 10,
                        childAspectRatio: columns == 1 ? 2.8 : 1.35,
                      ),
                      itemCount: products.length,
                      itemBuilder: (context, index) => _FastProductTile(
                        product: products[index],
                        currency: snapshot.currency,
                        controller: orderController,
                      ),
                    );
                  },
                ),
        ),
        const SizedBox(height: 8),
        Align(
          alignment: Alignment.centerRight,
          child: FilledButton.tonalIcon(
            key: const Key('fast-cashier-manual-amount'),
            onPressed: orderController.busy
                ? null
                : () => showManualAmountKeypad(
                    context,
                    controller: orderController,
                    currency: snapshot.currency,
                  ),
            icon: const Icon(Icons.dialpad),
            label: const Text('Importo libero'),
          ),
        ),""",
          )
          PY
          cd apps/pos
          dart format \
            lib/features/catalog/presentation/cashier_responsive_layout.dart \
            lib/features/catalog/presentation/operator_cashier_screen.dart \
            lib/features/catalog/presentation/offline_cashier_screen.dart \
            lib/features/catalog/presentation/fast_cashier_screen.dart \
            test/features/catalog/cashier_responsive_layout_test.dart
      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/pos-responsive-content-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(pos): make cashier content responsive across viewports'
          git push origin HEAD:fix/pos-responsive-content-layout
