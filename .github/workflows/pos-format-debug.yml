name: POS Format Debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: POS formatter exact output
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Print formatted navigation policy
        run: dart format --output=json lib/core/routing/operator_navigation_policy.dart
