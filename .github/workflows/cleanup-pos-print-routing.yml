name: Clean POS print routing diff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  clean:
    if: github.head_ref == 'feat/pos-friendly-print-routing'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pos-friendly-print-routing
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true
      - name: Apply focused advanced-mode patch
        shell: python
        run: |
          from pathlib import Path

          root = Path('apps/pos/lib/features/printing/presentation')
          source = root / 'printing_screen_advanced_base.dart'
          target = root / 'printing_screen.dart'
          target.write_text(source.read_text(encoding='utf-8'), encoding='utf-8')

          text = target.read_text(encoding='utf-8')
          old = "import '../platform/local_printer_backend_contract.dart';\nimport 'printing_controller.dart';"
          new = "import '../platform/local_printer_backend_contract.dart';\nimport 'payment_receipt_routing_card.dart';\nimport 'printing_controller.dart';"
          if old not in text:
              raise SystemExit('import anchor not found')
          text = text.replace(old, new, 1)

          old = """    return PrintingView(
      controller: controller,
      location: location,
      canManageJobs: _isManagerRole(session.role),
    );"""
          new = """    final canManageJobs = _isManagerRole(session.role);
    return PrintingView(
      controller: controller,
      location: location,
      canManageJobs: canManageJobs,
      onConfigureReceipts: () => showDialog<void>(
        context: context,
        builder: (dialogContext) => AlertDialog(
          title: const Text('Ricevute automatiche'),
          content: SizedBox(
            width: 620,
            child: PaymentReceiptRoutingCard(
              locationId: location.id,
              locationName: location.name,
              printers: controller.printers,
              canManage: canManageJobs,
            ),
          ),
          actions: [
            TextButton(
              onPressed: () => Navigator.pop(dialogContext),
              child: const Text('Chiudi'),
            ),
          ],
        ),
      ),
    );"""
          if old not in text:
              raise SystemExit('PrintingScreen anchor not found')
          text = text.replace(old, new, 1)

          old = """  const PrintingView({
    required this.controller,
    required this.location,
    required this.canManageJobs,
    super.key,
  });

  final PrintingController controller;
  final OperationalLocation location;
  final bool canManageJobs;"""
          new = """  const PrintingView({
    required this.controller,
    required this.location,
    required this.canManageJobs,
    this.onConfigureReceipts,
    super.key,
  });

  final PrintingController controller;
  final OperationalLocation location;
  final bool canManageJobs;
  final VoidCallback? onConfigureReceipts;"""
          if old not in text:
              raise SystemExit('PrintingView constructor anchor not found')
          text = text.replace(old, new, 1)

          old = "_Header(controller: controller, location: location)"
          new = "_Header(\n                controller: controller,\n                location: location,\n                onConfigureReceipts: onConfigureReceipts,\n              )"
          if text.count(old) != 2:
              raise SystemExit(f'expected 2 header calls, got {text.count(old)}')
          text = text.replace(old, new)

          old = """class _Header extends StatelessWidget {
  const _Header({required this.controller, required this.location});

  final PrintingController controller;
  final OperationalLocation location;"""
          new = """class _Header extends StatelessWidget {
  const _Header({
    required this.controller,
    required this.location,
    this.onConfigureReceipts,
  });

  final PrintingController controller;
  final OperationalLocation location;
  final VoidCallback? onConfigureReceipts;"""
          if old not in text:
              raise SystemExit('header class anchor not found')
          text = text.replace(old, new, 1)

          old = """      IconButton.filledTonal(
        key: const Key('printing-refresh-button'),"""
          new = """      if (onConfigureReceipts != null) ...[
        FilledButton.tonalIcon(
          key: const Key('printing-receipt-routing-button'),
          onPressed: onConfigureReceipts,
          icon: const Icon(Icons.receipt_long_outlined),
          label: const Text('Ricevute'),
        ),
        const SizedBox(width: 8),
      ],
      IconButton.filledTonal(
        key: const Key('printing-refresh-button'),"""
          if old not in text:
              raise SystemExit('header action anchor not found')
          text = text.replace(old, new, 1)

          target.write_text(text, encoding='utf-8')
          source.unlink()
      - name: Format, analyze and test POS printing
        working-directory: apps/pos
        shell: bash
        run: |
          flutter pub get
          dart format lib/features/printing/domain/payment_receipt_route.dart \
            lib/features/printing/presentation/payment_receipt_routing_card.dart \
            lib/features/printing/presentation/printing_screen.dart \
            test/features/printing/payment_receipt_route_test.dart
          flutter analyze
          flutter test test/features/printing
      - name: Commit clean implementation
        shell: bash
        run: |
          rm .github/workflows/cleanup-pos-print-routing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pos .github/workflows/cleanup-pos-print-routing.yml
          git commit -m 'refactor(pos): keep print routing diff focused'
          git push origin HEAD:feat/pos-friendly-print-routing
