  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run security:secrets
      - run: node scripts/check-secrets.mjs --self-test
      - run: node scripts/verify-production-config.mjs --self-test
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: docker build --build-arg FLUXA_APP=api -t fluxa-api:${{ github.sha }} .

  pos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'ndk;27.0.12077973'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: flutter build web --dart-define=FLUXA_ENV=test --dart-define=API_BASE_URL=https://test.invalid/api/v1
      # The debug APK is built and validated but is not uploaded on every PR.
      # Signed downloadable artifacts are produced only by android-release.yml.
"""
          Path('.github/workflows/ci.yml').write_text(original_ci, encoding='utf-8')
          Path('.github/workflows/fix-pos-analyze-pr24.yml').unlink(missing_ok=True)
          PY

          dart format apps/pos/lib/features/admin/presentation/admin_management_screen.dart apps/pos/lib/features/payments/presentation/checkout_screen.dart

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml apps/pos/lib/features/admin/presentation/admin_management_screen.dart apps/pos/lib/features/payments/presentation/checkout_screen.dart
          git add -u .github/workflows
          git commit -m "fix(pos): resolve analyzer errors"
          git push origin HEAD:feature/admin-management-ui
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'ndk;27.0.12077973'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: flutter build web --dart-define=FLUXA_ENV=test --dart-define=API_BASE_URL=https://test.invalid/api/v1
      # The debug APK is built and validated but is not uploaded on every PR.
      # Signed downloadable artifacts are produced only by android-release.yml.
