name: Fluxa CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fluxa-format-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pos-format-diagnostic:
    name: POS formatter diagnostic
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Print exact formatter diff
        shell: bash
        run: |
          dart format \
            lib/features/catalog/presentation/fast_cashier_screen.dart \
            lib/features/hospitality/presentation/fast_tables_screen.dart \
            lib/features/payments/presentation/fast_checkout_screen.dart
          git diff -- \
            lib/features/catalog/presentation/fast_cashier_screen.dart \
            lib/features/hospitality/presentation/fast_tables_screen.dart \
            lib/features/payments/presentation/fast_checkout_screen.dart
          exit 1
