name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run security:secrets
      - run: node scripts/check-secrets.mjs --self-test
      - run: node scripts/verify-production-config.mjs --self-test
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: docker build --build-arg FLUXA_APP=api -t fluxa-api:${{ github.sha }} .

  pos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-management-ui
          fetch-depth: 0
      - name: Apply source fix and restore CI
        working-directory: .
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          checkout_path = Path('apps/pos/lib/features/payments/presentation/checkout_screen.dart')
          checkout = checkout_path.read_text(encoding='utf-8')

          radio_pattern = re.compile(
              r"            child: RadioGroup<String>\(\n.*?            \),\n          \),\n        \),\n        actions:",
              re.DOTALL,
          )
          radio_replacement = """            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                if (options.defaultRouteConfigured)
                  RadioListTile<String>(
                    value: _defaultRouteChoice,
                    groupValue: selected,
                    onChanged: (value) {
                      if (value != null) {
                        setState(() => selected = value);
                      }
                    },
                    title: const Text('Rotta predefinita'),
                    subtitle: const Text(
                      'Usa la configurazione amministrativa',
                    ),
                  ),
                for (final printer in options.printers)
                  RadioListTile<String>(
                    value: printer.id,
                    groupValue: selected,
                    onChanged: (value) {
                      if (value != null) {
                        setState(() => selected = value);
                      }
                    },
                    title: Text(printer.name),
                    subtitle: Text('${printer.code} · ${printer.purpose}'),
                  ),
              ],
            ),
          ),
        ),
        actions:"""
          checkout, radio_count = radio_pattern.subn(radio_replacement, checkout, count=1)
          if radio_count != 1:
              raise SystemExit(f'Expected one RadioGroup replacement, got {radio_count}')

          if_pattern = re.compile(
              r"              if \(parsed != null\)\n                Navigator\.pop\(context, \(method, provider, parsed\)\);"
          )
          checkout, if_count = if_pattern.subn(
              """              if (parsed != null) {
                Navigator.pop(context, (method, provider, parsed));
              }""",
              checkout,
              count=1,
          )
          if if_count != 1:
              raise SystemExit(f'Expected one terminal if replacement, got {if_count}')
          if 'RadioGroup<String>' in checkout:
              raise SystemExit('RadioGroup still present')
          checkout_path.write_text(checkout, encoding='utf-8')

          admin_path = Path('apps/pos/lib/features/admin/presentation/admin_management_screen.dart')
          admin = admin_path.read_text(encoding='utf-8')
          old_admin = "    return [if (code != null) code, if (status != null) status].join(' · ');"
          new_admin = "    return [code, status].whereType<String>().join(' · ');"
          if old_admin in admin:
              admin = admin.replace(old_admin, new_admin, 1)
          admin_path.write_text(admin, encoding='utf-8')

          original_ci = """name: CI

on:
