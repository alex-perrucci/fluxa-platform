name: Fluxa CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: fluxa-format-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-restore:
    name: Apply POS formatter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true
      - name: Apply formatter and restore CI
        shell: bash
        run: |
          dart format \
            lib/features/catalog/presentation/fast_cashier_screen.dart \
            lib/features/hospitality/presentation/fast_tables_screen.dart \
            lib/features/payments/presentation/fast_checkout_screen.dart
          git fetch origin main
          cd ../..
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/format-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/format-diagnostic.yml \
            apps/pos/lib/features/catalog/presentation/fast_cashier_screen.dart \
            apps/pos/lib/features/hospitality/presentation/fast_tables_screen.dart \
            apps/pos/lib/features/payments/presentation/fast_checkout_screen.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(pos): format fast cashier flow"
          git push origin HEAD:${{ github.head_ref }}
