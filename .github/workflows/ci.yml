name: Fluxa CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fluxa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pos-format-once:
    name: Format POS fiscal printer changes once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true
      - name: Resolve, format, and commit generated files
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/features/fiscal/platform/fiscal_receipt_pdf_handler_io.dart \
            lib/features/fiscal/platform/fiscal_receipt_pdf_handler_stub.dart \
            lib/features/fiscal/platform/fiscal_receipt_thermal_printer.dart \
            lib/features/printing/platform/esc_pos_raster_formatter.dart \
            test/features/printing/esc_pos_raster_formatter_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pubspec.lock \
            lib/features/fiscal/platform/fiscal_receipt_pdf_handler_io.dart \
            lib/features/fiscal/platform/fiscal_receipt_pdf_handler_stub.dart \
            lib/features/fiscal/platform/fiscal_receipt_thermal_printer.dart \
            lib/features/printing/platform/esc_pos_raster_formatter.dart \
            test/features/printing/esc_pos_raster_formatter_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(pos): format fiscal receipt printer changes"
            git push origin HEAD:${{ github.head_ref }}
          fi
