name: Format helper

on:
  pull_request:

permissions:
  contents: read

jobs:
  dart-format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true
      - name: Format manual keypad
        working-directory: apps/pos
        run: dart format lib/features/orders/presentation/manual_amount_keypad.dart
      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-manual-keypad
          path: apps/pos/lib/features/orders/presentation/manual_amount_keypad.dart
          retention-days: 1
