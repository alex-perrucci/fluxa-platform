name: Debug Dart Format

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/pos/lib/features/hospitality/presentation/kitchen_screen.dart'
      - '.github/workflows/debug-dart-format.yml'

jobs:
  format-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Print formatter diff
        shell: bash
        run: |
          dart format lib/features/hospitality/presentation/kitchen_screen.dart
          git diff -- lib/features/hospitality/presentation/kitchen_screen.dart
