name: POS format final

on:
  push:
    branches:
      - agent/pos-unified-idiot-proof-workflow

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pos-unified-idiot-proof-workflow
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true

      - name: Format POS workflow files
        working-directory: apps/pos
        run: |
          dart format \
            lib/app.dart \
            lib/core/di/providers.dart \
            lib/core/routing/app_router.dart \
            lib/core/workflow/pos_workflow_coordinator.dart \
            lib/features/catalog/presentation/operator_cashier_screen.dart \
            lib/features/fiscal/presentation/operator_fiscal_screen.dart \
            lib/features/hospitality/presentation/operator_tables_screen.dart \
            lib/features/hospitality/presentation/table_controller.dart \
            lib/features/orders/presentation/operator_orders_screen.dart \
            lib/features/payments/presentation/fast_checkout_screen.dart \
            lib/features/payments/presentation/quick_payment_sheet.dart \
            lib/features/printing/presentation/operator_printing_screen.dart \
            lib/features/settings/presentation/operator_diagnostics_screen.dart \
            test/features/hospitality/table_controller_test.dart

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "alex-perrucci"
          git config user.email "128584526+alex-perrucci@users.noreply.github.com"
          git add apps/pos/lib apps/pos/test/features/hospitality/table_controller_test.dart
          git commit -m "style(pos): format unified workflow final pass"
          git push origin HEAD:agent/pos-unified-idiot-proof-workflow
