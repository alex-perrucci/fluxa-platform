name: Apply POS formatter

on:
  push:
    branches:
      - agent/pos-ux-coherence-pass

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/pos-ux-coherence-pass
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true
      - name: Apply formatter and remove helper
        shell: bash
        run: |
          dart format \
            lib/features/catalog/presentation/fast_cashier_screen.dart \
            lib/features/orders/presentation/orders_screen.dart
          cd ../..
          rm -f .github/workflows/apply-pos-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/pos/lib/features/catalog/presentation/fast_cashier_screen.dart \
            apps/pos/lib/features/orders/presentation/orders_screen.dart \
            .github/workflows/apply-pos-format.yml
          git commit -m "style(pos): format POS UX coherence pass"
          git push origin HEAD:agent/pos-ux-coherence-pass
