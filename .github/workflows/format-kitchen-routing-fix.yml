name: Format kitchen routing fix

on:
  push:
    branches:
      - fix/kitchen-routing-after-location-change

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kitchen-routing-after-location-change
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
      - name: Format changed Dart test
        working-directory: apps/pos
        run: dart format test/features/hospitality/kitchen_controller_test.dart
      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pos/test/features/hospitality/kitchen_controller_test.dart
          git diff --cached --quiet && exit 0
          git commit -m 'style(pos): format kitchen routing tests'
          git push origin HEAD:fix/kitchen-routing-after-location-change
