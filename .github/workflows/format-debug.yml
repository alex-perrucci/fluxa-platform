name: Dart format debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true
      - name: Show canonical formatter diff
        working-directory: apps/pos
        shell: bash
        run: |
          flutter pub get
          dart format test/features/hospitality/kitchen_controller_test.dart
          git diff -- test/features/hospitality/kitchen_controller_test.dart
          git diff --exit-code -- test/features/hospitality/kitchen_controller_test.dart
