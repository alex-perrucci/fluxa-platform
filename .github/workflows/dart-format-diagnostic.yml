name: Dart format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/pos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true

      - name: Print formatter diff
        shell: bash
        run: |
          dart format lib/features/payments/presentation/refunds_screen.dart
          git diff -- lib/features/payments/presentation/refunds_screen.dart
          test -z "$(git status --short -- lib/features/payments/presentation/refunds_screen.dart)"
