name: Fix POS Flutter compatibility temp

on:
  push:
    branches:
      - feat/pilot-operational-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pilot-operational-hardening
          fetch-depth: 0
      - name: Apply minimal Flutter 3.32 compatibility fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/pos/lib/features/catalog/presentation/offline_cashier_screen.dart')
          text = path.read_text(encoding='utf-8')
          old = "DropdownButtonFormField<String>(\n                  initialValue: selectedKey.isEmpty ? null : selectedKey,"
          new = "DropdownButtonFormField<String>(\n                  value: selectedKey.isEmpty ? null : selectedKey,"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one target occurrence, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Remove temporary workflow and push fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/fix-pos-initial-value-temp.yml
          git add apps/pos/lib/features/catalog/presentation/offline_cashier_screen.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(pos): restore Flutter 3.32 dropdown compatibility"
          git push origin HEAD:feat/pilot-operational-hardening
