name: POS content format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-responsive-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true
      - name: Apply Dart formatter
        working-directory: apps/pos
        run: |
          dart format \
            lib/features/catalog/presentation/cashier_responsive_layout.dart \
            lib/features/catalog/presentation/fast_cashier_screen.dart \
            lib/features/catalog/presentation/offline_cashier_screen.dart \
            lib/features/catalog/presentation/operator_cashier_screen.dart \
            test/features/catalog/cashier_responsive_layout_test.dart
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-responsive-content
          path: |
            apps/pos/lib/features/catalog/presentation/cashier_responsive_layout.dart
            apps/pos/lib/features/catalog/presentation/fast_cashier_screen.dart
            apps/pos/lib/features/catalog/presentation/offline_cashier_screen.dart
            apps/pos/lib/features/catalog/presentation/operator_cashier_screen.dart
            apps/pos/test/features/catalog/cashier_responsive_layout_test.dart
          if-no-files-found: error
          retention-days: 1
