name: Apply POS print routing implementation

on:
  push:
    branches:
      - feat/pos-friendly-print-routing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pos-friendly-print-routing
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true
      - name: Apply implementation
        shell: python
        run: |
          from pathlib import Path

          root = Path('apps/pos')

          models = r'''import 'printing_models.dart';

class PaymentReceiptRoute {
  const PaymentReceiptRoute({
    required this.id,
    required this.printerId,
    required this.printerName,
    required this.copies,
    required this.active,
  });

  factory PaymentReceiptRoute.fromJson(Map<String, Object?> json) {
    if (json['documentType']?.toString() !=
        PrintDocumentType.paymentReceipt.wireValue) {
      throw const FormatException('La configurazione non riguarda le ricevute di pagamento.');
    }
    final id = json['id']?.toString().trim() ?? '';
    final printerId = json['printerId']?.toString().trim() ?? '';
    if (id.isEmpty || printerId.isEmpty) {
      throw const FormatException('Configurazione stampante incompleta.');
    }
    final printerName = json['printerName']?.toString().trim();
    final copiesValue = json['copies'];
    final copies = copiesValue is int
        ? copiesValue
        : int.tryParse(copiesValue?.toString() ?? '') ?? 1;
    return PaymentReceiptRoute(
      id: id,
      printerId: printerId,
      printerName: printerName == null || printerName.isEmpty
          ? printerId
          : printerName,
      copies: copies,
      active: json['active'] != false,
    );
  }

  final String id;
  final String printerId;
  final String printerName;
  final int copies;
  final bool active;
}

PaymentReceiptRoute? paymentReceiptRouteFromPayload(Object? payload) {
  if (payload is! List) {
    throw const FormatException('Elenco configurazioni stampante non valido.');
  }
  for (final raw in payload) {
    if (raw is! Map) {
      continue;
    }
    final json = Map<String, Object?>.from(raw);
    if (json['documentType']?.toString() !=
        PrintDocumentType.paymentReceipt.wireValue) {
      continue;
    }
    if (json['kitchenStationId'] != null || json['active'] == false) {
      continue;
    }
    return PaymentReceiptRoute.fromJson(json);
  }
  return null;
}

bool canReceivePaymentReceipts(PrinterDevice printer) =>
    printer.status == PrinterStatus.active &&
    (printer.purpose == PrinterPurpose.receipt ||
        printer.purpose == PrinterPurpose.generic);
'''
          (root / 'lib/features/printing/domain/payment_receipt_route.dart').write_text(models, encoding='utf-8')

          card = r'''import 'package:dio/dio.dart';
import 'package:flutter/material.dart';
import 'package:flutter_riverpod/flutter_riverpod.dart';

import '../../../core/di/providers.dart';
import '../../../core/network/backend_error.dart';
import '../domain/payment_receipt_route.dart';
import '../domain/printing_models.dart';

class PaymentReceiptRoutingCard extends ConsumerStatefulWidget {
  const PaymentReceiptRoutingCard({
    required this.locationId,
    required this.locationName,
    required this.printers,
    required this.canManage,
    super.key,
  });

  final String locationId;
  final String locationName;
  final List<PrinterDevice> printers;
  final bool canManage;

  @override
  ConsumerState<PaymentReceiptRoutingCard> createState() =>
      _PaymentReceiptRoutingCardState();
}

class _PaymentReceiptRoutingCardState
    extends ConsumerState<PaymentReceiptRoutingCard> {
  PaymentReceiptRoute? _route;
  String? _selectedPrinterId;
  String? _errorMessage;
  bool _loading = true;
  bool _saving = false;

  @override
  void initState() {
    super.initState();
    Future<void>.microtask(_load);
  }

  @override
  void didUpdateWidget(covariant PaymentReceiptRoutingCard oldWidget) {
    super.didUpdateWidget(oldWidget);
    if (oldWidget.locationId != widget.locationId) {
      Future<void>.microtask(_load);
    }
  }

  List<PrinterDevice> get _availablePrinters => widget.printers
      .where(canReceivePaymentReceipts)
      .toList(growable: false);

  Future<void> _load() async {
    if (!mounted) return;
    setState(() {
      _loading = true;
      _errorMessage = null;
    });
    try {
      final response = await ref.read(apiClientProvider).dio.get<Object?>(
        'print-routes',
        queryParameters: {'locationId': widget.locationId},
      );
      final route = paymentReceiptRouteFromPayload(response.data);
      if (!mounted) return;
      setState(() {
        _route = route;
        _selectedPrinterId = _availablePrinters.any(
          (printer) => printer.id == route?.printerId,
        )
            ? route?.printerId
            : null;
        _loading = false;
      });
    } on DioException catch (error) {
      _finishLoadWithError(BackendError.fromDioException(error).message);
    } on FormatException {
      _finishLoadWithError('Fluxa non riesce a leggere la scelta della stampante. Riprova.');
    } catch (_) {
      _finishLoadWithError('Impossibile controllare dove vengono stampate le ricevute.');
    }
  }

  void _finishLoadWithError(String message) {
    if (!mounted) return;
    setState(() {
      _loading = false;
      _errorMessage = message;
    });
  }

  Future<void> _save() async {
    if (_saving || !widget.canManage) return;
    setState(() {
      _saving = true;
      _errorMessage = null;
    });
    try {
      final dio = ref.read(apiClientProvider).dio;
      final printerId = _selectedPrinterId;
      PaymentReceiptRoute? nextRoute;
      if (printerId == null) {
        final currentRoute = _route;
        if (currentRoute != null) {
          await dio.delete<Object?>('print-routes/${currentRoute.id}');
        }
      } else {
        final response = await dio.put<Map<String, Object?>>(
          'print-routes',
          data: {
            'locationId': widget.locationId,
            'documentType': PrintDocumentType.paymentReceipt.wireValue,
            'printerId': printerId,
            'copies': 1,
            'active': true,
          },
        );
        final data = response.data;
        if (data == null) {
          throw const FormatException('Configurazione stampante vuota.');
        }
        nextRoute = PaymentReceiptRoute.fromJson(data);
      }
      if (!mounted) return;
      setState(() {
        _route = nextRoute;
        _selectedPrinterId = nextRoute?.printerId;
        _saving = false;
      });
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(
          content: Text(
            nextRoute == null
                ? 'Stampa automatica delle ricevute disattivata.'
                : 'Ricevute inviate automaticamente a ${nextRoute.printerName}.',
          ),
        ),
      );
    } on DioException catch (error) {
      _finishSaveWithError(BackendError.fromDioException(error).message);
    } on FormatException {
      _finishSaveWithError('Fluxa non ha confermato la scelta. Riprova.');
    } catch (_) {
      _finishSaveWithError('Impossibile salvare la stampante per le ricevute.');
    }
  }

  void _finishSaveWithError(String message) {
    if (!mounted) return;
    setState(() {
      _saving = false;
      _errorMessage = message;
    });
  }

  @override
  Widget build(BuildContext context) {
    final printers = _availablePrinters;
    final routeMissingFromList = _route != null &&
        !printers.any((printer) => printer.id == _route!.printerId);
    return Card(
      key: const Key('payment-receipt-routing-card'),
      child: Padding(
        padding: const EdgeInsets.all(14),
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Row(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                const Icon(Icons.receipt_long_outlined),
                const SizedBox(width: 10),
                Expanded(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        'Dove stampare le ricevute',
                        style: Theme.of(context).textTheme.titleMedium,
                      ),
                      const Text(
                        'Scegli la stampante che Fluxa userà automaticamente dopo un pagamento.',
                      ),
                      Text(
                        'La scelta vale per tutte le casse di ${widget.locationName}.',
                        style: Theme.of(context).textTheme.bodySmall,
                      ),
                    ],
                  ),
                ),
                IconButton(
                  key: const Key('payment-receipt-routing-refresh'),
                  tooltip: 'Controlla di nuovo',
                  onPressed: _loading || _saving ? null : _load,
                  icon: const Icon(Icons.refresh),
                ),
              ],
            ),
            const SizedBox(height: 12),
            if (_loading)
              const Row(
                children: [
                  SizedBox.square(
                    dimension: 18,
                    child: CircularProgressIndicator(strokeWidth: 2),
                  ),
                  SizedBox(width: 10),
                  Text('Controllo della stampante per le ricevute...'),
                ],
              )
            else if (printers.isEmpty)
              const Text(
                'Non ci sono stampanti attive adatte alle ricevute. Attivane una di tipo Ricevute o Generica, poi torna qui.',
              )
            else
              LayoutBuilder(
                builder: (context, constraints) {
                  final selector = DropdownButtonFormField<String?>(
                    key: const Key('payment-receipt-printer-selector'),
                    value: _selectedPrinterId,
                    isExpanded: true,
                    decoration: const InputDecoration(
                      labelText: 'Stampante per le ricevute',
                      border: OutlineInputBorder(),
                      isDense: true,
                    ),
                    items: [
                      const DropdownMenuItem<String?>(
                        value: null,
                        child: Text('Non stampare automaticamente'),
                      ),
                      ...printers.map(
                        (printer) => DropdownMenuItem<String?>(
                          value: printer.id,
                          child: Text(
                            printer.name,
                            overflow: TextOverflow.ellipsis,
                          ),
                        ),
                      ),
                    ],
                    onChanged: !widget.canManage || _saving
                        ? null
                        : (value) => setState(() => _selectedPrinterId = value),
                  );
                  final save = FilledButton.icon(
                    key: const Key('payment-receipt-routing-save'),
                    onPressed: !widget.canManage || _saving ? null : _save,
                    icon: _saving
                        ? const SizedBox.square(
                            dimension: 16,
                            child: CircularProgressIndicator(strokeWidth: 2),
                          )
                        : const Icon(Icons.check),
                    label: const Text('Salva scelta'),
                  );
                  if (constraints.maxWidth < 680) {
                    return Column(
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        selector,
                        const SizedBox(height: 10),
                        save,
                      ],
                    );
                  }
                  return Row(
                    children: [
                      Expanded(child: selector),
                      const SizedBox(width: 10),
                      save,
                    ],
                  );
                },
              ),
            if (routeMissingFromList) ...[
              const SizedBox(height: 8),
              const Text(
                'La stampante usata in precedenza non è più disponibile. Scegline una nuova.',
              ),
            ],
            if (_errorMessage != null) ...[
              const SizedBox(height: 8),
              Text(
                _errorMessage!,
                style: TextStyle(color: Theme.of(context).colorScheme.error),
              ),
            ] else if (!_loading && printers.isNotEmpty) ...[
              const SizedBox(height: 8),
              Text(
                _route == null
                    ? 'Adesso le ricevute non vengono stampate automaticamente.'
                    : 'Adesso le ricevute dei pagamenti escono su ${_route!.printerName}.',
              ),
            ],
            if (!widget.canManage) ...[
              const SizedBox(height: 8),
              const Text('Solo un responsabile può cambiare questa scelta.'),
            ],
          ],
        ),
      ),
    );
  }
}
'''
          (root / 'lib/features/printing/presentation/payment_receipt_routing_card.dart').write_text(card, encoding='utf-8')

          test = r'''import 'package:flutter_test/flutter_test.dart';
import 'package:fluxa_pos/features/printing/domain/payment_receipt_route.dart';
import 'package:fluxa_pos/features/printing/domain/printing_models.dart';

void main() {
  test('finds the active general payment receipt route', () {
    final route = paymentReceiptRouteFromPayload([
      {
        'id': 'kitchen-route',
        'documentType': 'KITCHEN_TICKET',
        'printerId': 'kitchen-printer',
        'printerName': 'Cucina',
        'copies': 1,
        'active': true,
      },
      {
        'id': 'receipt-route',
        'documentType': 'PAYMENT_RECEIPT',
        'kitchenStationId': null,
        'printerId': 'receipt-printer',
        'printerName': 'BANCO',
        'copies': 1,
        'active': true,
      },
    ]);

    expect(route, isNotNull);
    expect(route!.printerId, 'receipt-printer');
    expect(route.printerName, 'BANCO');
  });

  test('ignores disabled payment receipt routes', () {
    final route = paymentReceiptRouteFromPayload([
      {
        'id': 'receipt-route',
        'documentType': 'PAYMENT_RECEIPT',
        'printerId': 'receipt-printer',
        'printerName': 'BANCO',
        'copies': 1,
        'active': false,
      },
    ]);

    expect(route, isNull);
  });

  test('only active receipt or generic printers can receive payment receipts', () {
    expect(canReceivePaymentReceipts(_printer(PrinterPurpose.receipt)), isTrue);
    expect(canReceivePaymentReceipts(_printer(PrinterPurpose.generic)), isTrue);
    expect(canReceivePaymentReceipts(_printer(PrinterPurpose.kitchen)), isFalse);
    expect(
      canReceivePaymentReceipts(
        _printer(PrinterPurpose.receipt, status: PrinterStatus.disabled),
      ),
      isFalse,
    );
  });
}

PrinterDevice _printer(
  PrinterPurpose purpose, {
  PrinterStatus status = PrinterStatus.active,
}) => PrinterDevice(
  id: 'printer-${purpose.wireValue}',
  organizationId: 'organization-1',
  locationId: 'location-1',
  code: 'PRINTER',
  name: 'Stampante',
  purpose: purpose,
  agentDeviceId: 'device-1',
  driver: 'ESC_POS_TEXT',
  paperWidthMm: 80,
  charactersPerLine: 48,
  supportsCut: true,
  supportsDrawer: false,
  status: status,
  lastSeenAt: null,
  agentVersion: null,
  statusMessage: null,
  createdAt: DateTime.utc(2026, 8, 20),
  updatedAt: DateTime.utc(2026, 8, 20),
);
'''
