name: Apply POS print routing

on:
  push:
    branches:
      - feat/pos-friendly-print-routing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pos-friendly-print-routing
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true
      - name: Add routing card to advanced printing only
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/pos/lib/features/printing/presentation/printing_screen.dart')
          text = path.read_text(encoding='utf-8')

          old = "import '../platform/local_printer_backend_contract.dart';\nimport 'printing_controller.dart';"
          new = "import '../platform/local_printer_backend_contract.dart';\nimport 'payment_receipt_routing_card.dart';\nimport 'printing_controller.dart';"
          if old not in text:
              raise SystemExit('import anchor not found')
          text = text.replace(old, new, 1)

          old = """              _AgentCard(controller: controller),
              const SizedBox(height: 12),
              SizedBox(height: mobilePaneHeight, child: selectedPane),"""
          new = """              _AgentCard(controller: controller),
              const SizedBox(height: 12),
              PaymentReceiptRoutingCard(
                locationId: location.id,
                locationName: location.name,
                printers: controller.printers,
                canManage: canManageJobs,
              ),
              const SizedBox(height: 12),
              SizedBox(height: mobilePaneHeight, child: selectedPane),"""
          if old not in text:
              raise SystemExit('mobile anchor not found')
          text = text.replace(old, new, 1)

          old = """              _AgentCard(controller: controller),
              const SizedBox(height: 12),
              Expanded("""
          new = """              _AgentCard(controller: controller),
              const SizedBox(height: 12),
              PaymentReceiptRoutingCard(
                locationId: location.id,
                locationName: location.name,
                printers: controller.printers,
                canManage: canManageJobs,
              ),
              const SizedBox(height: 12),
              Expanded("""
          if old not in text:
              raise SystemExit('desktop anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Format, analyze and test printing
        working-directory: apps/pos
        shell: bash
        run: |
          flutter pub get
          dart format lib/features/printing/domain/payment_receipt_route.dart \
            lib/features/printing/presentation/payment_receipt_routing_card.dart \
            lib/features/printing/presentation/printing_screen.dart \
            test/features/printing/payment_receipt_route_test.dart
          flutter analyze
          flutter test test/features/printing
      - name: Commit implementation and remove helper
        shell: bash
        run: |
          rm .github/workflows/apply-pos-print-routing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pos .github/workflows/apply-pos-print-routing.yml
          git commit -m 'feat(pos): add friendly receipt printer routing'
          git push origin HEAD:feat/pos-friendly-print-routing
