name: Fix POS analyze compatibility

on:
  push:
    branches:
      - agent/pos-ux-coherence-pass

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/pos-ux-coherence-pass
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true
      - name: Fix analyzer issue and remove helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/orders/presentation/orders_screen.dart')
          text = path.read_text()
          old = "return const FilledButton.tonalIcon(\n        onPressed: null,"
          new = "return FilledButton.tonalIcon(\n        onPressed: null,"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one const tonal button, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          dart format lib/features/orders/presentation/orders_screen.dart
          cd ../..
          rm -f .github/workflows/fix-pos-analyze.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/pos/lib/features/orders/presentation/orders_screen.dart \
            .github/workflows/fix-pos-analyze.yml
          git commit -m "fix(pos): avoid const tonal fiscal action"
          git push origin HEAD:agent/pos-ux-coherence-pass
