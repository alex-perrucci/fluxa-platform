name: Format POS PR 24

on:
  push:
    branches:
      - feature/admin-management-ui
    paths:
      - .github/workflows/format-pos-pr24.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Format failing files
        run: |
          dart format \
            apps/pos/lib/features/admin/presentation/admin_management_screen.dart \
            apps/pos/lib/features/payments/presentation/checkout_screen.dart

      - name: Publish formatter output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C ci/format-pos-pr24
          git add \
            apps/pos/lib/features/admin/presentation/admin_management_screen.dart \
            apps/pos/lib/features/payments/presentation/checkout_screen.dart
          git commit -m "style(pos): apply dart formatting"
          git push --force origin HEAD:ci/format-pos-pr24
